name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
      - "*.*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.0.0.0"
        required: true
      version:
        description: "Optional explicit plugin version. Defaults to tag without leading v."
        required: false

permissions:
  contents: write

env:
  PROJECT_PATH: ./YummyKodik/YummyKodik.csproj

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Compute version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          V="${{ github.event.inputs.version }}"
          if [[ -z "$V" ]]; then
            V="${TAG#v}"
          fi

          # Normalize to 4-part version (Jellyfin plugin convention)
          IFS='.' read -r a b c d <<<"$V"
          if [[ -z "${d:-}" ]]; then
            V="${V}.0"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "zip=YummyKodik_${V}.zip" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${PROJECT_PATH}"

      - name: Publish (Release)
        run: |
          dotnet publish "${PROJECT_PATH}" -c Release -o artifacts/publish \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -p:AssemblyVersion="${{ steps.ver.outputs.version }}" \
            -p:FileVersion="${{ steps.ver.outputs.version }}"

      - name: Package ZIP + MD5
        shell: bash
        run: |
          set -euo pipefail

          V="${{ steps.ver.outputs.version }}"
          ZIP="${{ steps.ver.outputs.zip }}"

          rm -rf artifacts/package
          mkdir -p artifacts/package

          # Main plugin assembly
          cp "artifacts/publish/YummyKodik.dll" artifacts/package/

          if [[ -f "artifacts/publish/YummyKodik.deps.json" ]]; then
            cp "artifacts/publish/YummyKodik.deps.json" artifacts/package/
          fi

          if [[ -f "YummyKodik/Assets/logo.png" ]]; then
            cp "YummyKodik/Assets/logo.png" artifacts/package/
          fi

          if [[ -f "YummyKodik/Assets/logo.svg" ]]; then
            cp "YummyKodik/Assets/logo.svg" artifacts/package/
          fi

          # Third-party deps (add more here if you introduce them)
          if [[ -f "artifacts/publish/HtmlAgilityPack.dll" ]]; then
            cp "artifacts/publish/HtmlAgilityPack.dll" artifacts/package/
          fi

          # Optional symbols/docs (handy for debugging; safe to omit)
          if [[ -f "artifacts/publish/YummyKodik.pdb" ]]; then
            cp "artifacts/publish/YummyKodik.pdb" artifacts/package/
          fi

          (cd artifacts/package && zip -r "../${ZIP}" .)

          # Jellyfin uses an MD5 checksum in manifests
          md5sum "artifacts/${ZIP}" | awk '{print $1}' > "artifacts/${ZIP}.md5"

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          cat > release-notes.md <<'MARKDOWN'
          ## What changed

          - Made library refresh faster while keeping external API pressure conservative. Refresh workers can process different titles in parallel, but the default limit remains 2.
          - Added a single-run gate so a second refresh exits quickly instead of doing duplicate work.
          - Added per-series filesystem locks so season folder migration, cleanup, STRM/NFO writes, and state writes are serialized for the same series root.
          - Split the refresh flow into smaller services for title loading, metadata writing, episode generation, Kodik supplementing, state checks, and cleanup.
          - Added refresh state files for safe single-file skips. State is multi-season, written atomically, and never stores raw provider tokens, cookies, bearer tokens, or secret-bearing URLs.
          - Added strict skip validation. The plugin now checks fingerprints, covered episodes, managed file hashes, missing files, and stale episode-shaped artifacts before skipping a title.
          - Kept per-voice mode conservative. It still runs full provider lookup so new voice translation files can appear even when episode counts do not change.
          - Made corrupt, missing, stale, or ambiguous refresh state fall back to a full refresh instead of failing or skipping too aggressively.
          - Improved stale artifact cleanup for generated episode STRM/NFO files, including zero-episode and future-episode cases.
          - Improved legacy season folder and episode filename migration under the series-root lock.
          - Fixed atomic text writes so existing read-only generated STRM/NFO files can be replaced during refresh.
          - Made Shikimori layout caching safe for concurrent refresh workers.
          - Made shared Kodik token and lookup paths safer under parallel refresh and runtime playback.
          - Delayed Kodik client initialization until a title actually needs Kodik supplement data.
          - Added refresh performance diagnostics for slow-stage and file-operation troubleshooting.
          - Added a configurable Minimum plugin log level. The default is Warning, so normal refresh and playback no longer spam Jellyfin with informational YummyKodik logs.
          - Fixed a logging startup regression by avoiding global ILogger replacement and filtering only YummyKodik loggers.
          - Improved Alloha/CVH/Kodik fallback handling, voice matching, playlist proxy recovery, and token refresh behavior used by runtime playback.
          - Added regression coverage for refresh state skips, stale artifacts, parallelism, run gate behavior, thread-safe Shikimori cache, atomic file replacement, and plugin log filtering.

          ## After updating

          - Restart Jellyfin after the plugin update.
          - Open YummyKodik settings and verify Output root path and Jellyfin server base URL.
          - Leave Minimum plugin log level at Warning for quiet normal operation, or lower it to Information/Debug/Trace only while diagnosing an issue.
          - In Docker, use container paths such as /media/yummykodik, not Windows host paths.
          - Run Scheduled Tasks -> YummyKodik library refresh after changing slugs, user-list settings, ServerBaseUrl, or per-voice STRM mode.
          - Scan the Jellyfin library that points at the generated folder.
          MARKDOWN

          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            cat release-notes.md
            cat <<'MARKDOWN'

          ## Install / update

          Raw manifest (works without GitHub Pages):

          ```text
          https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/manifest.json
          ```

          GitHub Pages manifest (optional, requires Pages to be enabled):

          ```text
          https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json
          ```
          MARKDOWN
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release-body.md
          files: |
            artifacts/${{ steps.ver.outputs.zip }}
            artifacts/${{ steps.ver.outputs.zip }}.md5

      - name: Generate / update manifest.json (for gh-pages)
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="${{ steps.ver.outputs.zip }}"
          CHECKSUM="$(cat "artifacts/${ZIP}.md5")"
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          GUID="6801ee3f-27f2-4d4e-ab37-e569c025b7c5"
          NAME="YummyKodik"
          CATEGORY="General"
          OWNER="${{ github.repository_owner }}"
          DESCRIPTION="Creates Jellyfin anime series cards from YummyAnime and streams episodes from Alloha, CVH, and Kodik-backed sources."
          OVERVIEW="Builds a local STRM/NFO library from YummyAnime and plays episodes via Alloha, CVH, and Kodik-backed sources."
          TARGET_ABI="10.11.0.0"

          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP}"
          CHANGELOG="$(cat release-notes.md)"
          IMAGE_URL="https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/main/YummyKodik/Assets/logo.png"

          mkdir -p site

          # Fetch previous manifest from gh-pages (if it exists) so we keep older versions.
          OLD_URL="https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/manifest.json"
          if curl -fsSL "$OLD_URL" -o site/manifest.old.json; then
            echo "Loaded existing manifest from gh-pages."
          else
            echo "[] " > site/manifest.old.json
          fi

          jq \
            --arg guid "$GUID" \
            --arg category "$CATEGORY" \
            --arg name "$NAME" \
            --arg description "$DESCRIPTION" \
            --arg owner "$OWNER" \
            --arg overview "$OVERVIEW" \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg targetAbi "$TARGET_ABI" \
            --arg sourceUrl "$SOURCE_URL" \
            --arg checksum "$CHECKSUM" \
            --arg timestamp "$TS" \
            --arg imageUrl "$IMAGE_URL" \
            '
            def ver: {
              version: $version,
              changelog: $changelog,
              targetAbi: $targetAbi,
              sourceUrl: $sourceUrl,
              checksum: $checksum,
              timestamp: $timestamp
            };

            def upsert_plugin($arr):
              ($arr | map(
                if .guid == $guid then
                  .category = $category
                  | .name = $name
                  | .description = $description
                  | .owner = $owner
                  | .overview = $overview
                  | .imageUrl = $imageUrl
                  | .versions = ([ver] + ((.versions // []) | map(select(.version != $version))))
                else .
                end
              )) as $updated
              | if ($updated | any(.guid == $guid)) then
                  $updated
                else
                  $updated + [{
                    category: $category,
                    guid: $guid,
                    name: $name,
                    description: $description,
                    owner: $owner,
                    overview: $overview,
                    imageUrl: $imageUrl,
                    versions: [ver]
                  }]
                end;

            upsert_plugin(.)
            ' site/manifest.old.json > site/manifest.json

          cp "YummyKodik/Assets/logo.png" site/logo.png
          cp "YummyKodik/Assets/logo-mono.png" site/logo-mono.png
          cp "YummyKodik/Assets/wordmark.png" site/wordmark.png
          cp "YummyKodik/Assets/logo.svg" site/logo.svg
          cp "YummyKodik/Assets/wordmark.svg" site/wordmark.svg

          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>YummyKodik Jellyfin plugin repository</title>
          <h1>YummyKodik Jellyfin plugin repository</h1>
          <p><img src="./wordmark.png" alt="YummyKodik logo" width="420" /></p>
          <p>Manifest: <a href="./manifest.json">manifest.json</a></p>
          HTML

      - name: Publish manifest to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
